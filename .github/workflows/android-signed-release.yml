name: Android Signed Release (Manual Gates)

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "Signed prerelease candidate or evidence-verified stable release"
        required: true
        default: candidate
        type: choice
        options: [candidate, stable]
      version:
        description: "Must equal Gradle versionName (e.g. 0.3.5-alpha)"
        required: true
        type: string
      publish:
        description: "Publish stable GitHub Release only after GO and human confirmation"
        required: true
        default: false
        type: boolean
      confirmation:
        description: "For stable publication only, type PUBLISH_STABLE"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: spdecode-manual-signed-release
  cancel-in-progress: false

jobs:
  gate:
    name: Reconfirm source, CI and production evidence
    if: github.ref == 'refs/heads/main' && github.repository == 'Gh0stDeveloper/SP-DECODE'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: preflight
        env:
          RELEASE_KIND: ${{ inputs.kind }}
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$VERSION" != *$'\n'* ]] || exit 1
          [[ "$VERSION" != *$'\r'* ]] || exit 1
          python scripts/android_release_gate.py --mode "$RELEASE_KIND" --version "$VERSION"
          APP_VERSION=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts)
          test "$APP_VERSION" = "$VERSION" || { echo "::error::versionName mismatch"; exit 1; }
          if [[ "$PUBLISH" == "true" ]]; then
            test "$RELEASE_KIND" = "stable" && test "$CONFIRMATION" = "PUBLISH_STABLE" || {
              echo "::error::Publishing requires stable evidence and explicit confirmation"
              exit 1
            }
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Require green validate workflow on this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/runs" \
            -f head_sha="$SHA" -f per_page=20 > "$RUNNER_TEMP/ci.json"
          jq -e --arg sha "$SHA" 'any(.workflow_runs[]; .head_sha == $sha and .conclusion == "success")' \
            "$RUNNER_TEMP/ci.json" > /dev/null || {
              echo "::error::Main CI has not passed for the exact source commit"
              exit 1
            }

  signed-apk:
    name: Build, verify and optionally publish a signed APK
    needs: gate
    runs-on: ubuntu-latest
    environment: ${{ inputs.kind == 'stable' && 'spdecode-production' || 'spdecode-candidate' }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android SDK 35 tools
        run: |
          set -euo pipefail
          MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$MANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Check offline permissions and signing secrets availability
        env:
          STORE_B64: ${{ secrets.SPDECODE_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SPDECODE_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SPDECODE_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SPDECODE_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$STORE_B64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            test -n "$value" || { echo "::error::Required signing secret is missing"; exit 1; }
          done
          ! grep -Eq '<uses-permission[^>]+(INTERNET|MANAGE_EXTERNAL_STORAGE)' \
            android/app/src/main/AndroidManifest.xml || {
              echo "::error::Offline manifest regression"; exit 1
            }
          umask 077
          printf '%s' "$STORE_B64" | base64 --decode > "$RUNNER_TEMP/spdecode-release.jks"
      - name: Assemble signed production variant
        working-directory: android
        env:
          SPDECODE_RELEASE_STORE_FILE: ${{ runner.temp }}/spdecode-release.jks
          SPDECODE_RELEASE_STORE_PASSWORD: ${{ secrets.SPDECODE_SIGNING_STORE_PASSWORD }}
          SPDECODE_RELEASE_KEY_ALIAS: ${{ secrets.SPDECODE_SIGNING_KEY_ALIAS }}
          SPDECODE_RELEASE_KEY_PASSWORD: ${{ secrets.SPDECODE_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Validate real APK signature and byte alignment
        id: verify
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/signature.txt"
          grep -F 'Verified using v1 scheme (JAR signing): true' "$RUNNER_TEMP/signature.txt"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/signature.txt"
          "$TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          mkdir -p dist
          cp "$APK" "dist/SP-DECODE-$VERSION-signed.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Upload signed artifact for internal installation checks
        uses: actions/upload-artifact@v4
        with:
          name: SP-DECODE-${{ needs.gate.outputs.version }}-signed-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Publish only after stable GO and protected environment review
        if: inputs.kind == 'stable' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" "dist/SP-DECODE-$VERSION-signed.apk" "dist/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" --title "SP-DECODE Android v$VERSION" \
            --notes "Signed Android release. See release/android-readiness.json and docs/android/RELEASE_RUNBOOK.md for verified gate evidence."
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/spdecode-release.jks"
