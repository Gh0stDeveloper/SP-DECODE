name: Validate SP-DECODE

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install PHP runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Node.js dependencies
        run: npm ci

      - name: Check installer shell syntax
        run: bash -n installers/install-termux.sh installers/install-vps.sh scripts/spdecode-termux.sh scripts/spdecode-vps.sh

      - name: Validate project
        run: python validate_project.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Probe batch-seven synthetic decoder candidates
        run: PYTHONPATH=. python tests/golden/a23_probe7.py

      - name: Probe final SSH synthetic decoder fixture (diagnostic)
        run: PYTHONPATH=. python tests/golden/a23_probe8_ssh.py

      - name: A.2 static decoder source audit (read-only)
        run: python docs/android/audit_decoders.py --output-dir "$RUNNER_TEMP/spdecode-a2"

      - name: Upload sanitized A.2 decoder audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spdecode-android-a2-audit
          path: ${{ runner.temp }}/spdecode-a2/
          if-no-files-found: ignore
          retention-days: 30

      - name: Generate A.2.3 synthetic golden coverage (metadata only)
        run: PYTHONPATH=. python tests/golden/a23_report.py --output "$RUNNER_TEMP/spdecode-a23/coverage.json"

      - name: Export synthetic decoder samples with frozen hashes
        run: PYTHONPATH=. python tests/golden/a23_export.py --output-dir "$RUNNER_TEMP/spdecode-a23/samples"

      - name: Upload A.2.3 synthetic golden coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spdecode-android-a23-golden-coverage
          path: ${{ runner.temp }}/spdecode-a23/
          if-no-files-found: ignore
          retention-days: 30

      - name: Validate Android documentation and editable SVGs
        run: python docs/android/validate_docs.py


  android-parity:
    name: Android emulator .v2 synthetic parity (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Python fixture dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare SHA-256-pinned synthetic parity assets
        run: PYTHONPATH=. python scripts/android_a24_prepare.py --output-dir android/app/src/androidTest/assets/parity

      - name: Build Android experimental debug host and tests
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:assembleAndroidTest

      - name: Enable hardware acceleration for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run parity tests on connected Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd android && gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spdecode-a24-android-parity-test-evidence
          path: |
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload experimental test-only Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spdecode-a24-experimental-test-host-not-production
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
