name: Android Production Signed APK

# This is a production keystore build, never a debug or generated test key.
# Trigger ONLY after the full main push workflow succeeds. Manual rerun allowed.
on:
  workflow_run:
    workflows: ["Validate SP-DECODE"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: spdecode-production-sign-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Require successful main validation at exact revision
    if: >-
      github.repository == 'Gh0stDeveloper/SP-DECODE' &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.conclusion == 'success'
        ) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.verify.outputs.eligible }}
      version: ${{ steps.verify.outputs.version }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - id: verify
        env:
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          EVENT_KIND: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$SOURCE_SHA" != "$MAIN_SHA" ]]; then
            echo "Skipping old main commit: $SOURCE_SHA (current: $MAIN_SHA)"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_KIND" == "workflow_dispatch" ]]; then
            gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/runs" \
              -f head_sha="$SOURCE_SHA" -f branch=main -f event=push -f per_page=30 \
              > "$RUNNER_TEMP/ci.json"
            jq -e --arg sha "$SOURCE_SHA" \
              'any(.workflow_runs[]; .head_sha == $sha and .event == "push" and .head_branch == "main" and .conclusion == "success")' \
              "$RUNNER_TEMP/ci.json" >/dev/null || {
                echo "::error::Exact main SHA has no successful full Validate SP-DECODE run"
                exit 1
              }
          fi
          VERSION="$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts)"
          [[ "$VERSION" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Production APK requires a stable versionName, not an alpha"
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "eligible=true" >> "$GITHUB_OUTPUT"

  sign-production:
    name: Build production APK with permanent GitHub keystore (V1/V2/V3)
    needs: preflight
    if: needs.preflight.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install required Android SDK
        run: |
          set -euo pipefail
          MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$MANAGER"
          "$MANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Generate the same audited local assets as validated by CI
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          PYTHONPATH=. python scripts/android_a24_whitebox_export.py \
            --output android/app/src/main/assets/npv_whitebox.bin
      - name: Load permanent signing keystore exclusively from GitHub Secrets
        env:
          STORE_BASE64: ${{ secrets.SPDECODE_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SPDECODE_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SPDECODE_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SPDECODE_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in "$STORE_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            test -n "$secret" || {
              echo "::error::One or more permanent SPDECODE_SIGNING_* secrets are missing"
              exit 1
            }
          done
          umask 077
          printf '%s' "$STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spdecode-production.p12"
          test "$(stat -c %s "$RUNNER_TEMP/spdecode-production.p12")" -gt 1000
          keytool -list -keystore "$RUNNER_TEMP/spdecode-production.p12" \
            -storetype PKCS12 -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Assemble real Android release using the repository keystore
        working-directory: android
        env:
          SPDECODE_RELEASE_STORE_FILE: ${{ runner.temp }}/spdecode-production.p12
          SPDECODE_RELEASE_STORE_PASSWORD: ${{ secrets.SPDECODE_SIGNING_STORE_PASSWORD }}
          SPDECODE_RELEASE_KEY_ALIAS: ${{ secrets.SPDECODE_SIGNING_KEY_ALIAS }}
          SPDECODE_RELEASE_KEY_PASSWORD: ${{ secrets.SPDECODE_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Align and explicitly sign V1/V2/V3 using the permanent repository keystore
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SPDECODE_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SPDECODE_SIGNING_KEY_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.SPDECODE_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          # Same permanent certificate from Secrets; NEVER generate a new key.
          "$TOOLS/zipalign" -P 16 -f 4 "$APK" "$RUNNER_TEMP/production-aligned.apk"
          export SPDECODE_STORE_PASS="$SIGNING_STORE_PASSWORD"
          export SPDECODE_KEY_PASS="$SIGNING_KEY_PASSWORD"
          "$TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/spdecode-production.p12" --ks-type PKCS12 \
            --ks-key-alias "$SIGNING_ALIAS" \
            --ks-pass env:SPDECODE_STORE_PASS \
            --key-pass env:SPDECODE_KEY_PASS \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$RUNNER_TEMP/production-v1-v2-v3.apk" \
            "$RUNNER_TEMP/production-aligned.apk"
          mv "$RUNNER_TEMP/production-v1-v2-v3.apk" "$APK"
          unset SPDECODE_STORE_PASS SPDECODE_KEY_PASS
      - name: Verify release signature schemes, package, version and 16 KiB alignment
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          if ! "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/signature.txt" 2>&1; then
            echo "::error::apksigner could not verify the production APK"
            sed -E '/^Signer #.*certificate DN:/d' "$RUNNER_TEMP/signature.txt" | tail -n 45
            exit 1
          fi
          # minSdkVersion=24 means apksigner uses V2/V3 by default and
          # reports V1 "false" even when the JAR signature exists.
          # Verify V1 separately in API23 range, then V2/V3 at real minSdk.
          if ! "$TOOLS/apksigner" verify --verbose --print-certs \
              --min-sdk-version 23 --max-sdk-version 23 "$APK" \
              > "$RUNNER_TEMP/signature-v1.txt" 2>&1; then
            echo "::error::V1 JAR signature did not verify in API23 range"
            tail -n 25 "$RUNNER_TEMP/signature-v1.txt"
            exit 1
          fi
          if ! grep -Eiq '^Verified using v1 scheme .*: true$' "$RUNNER_TEMP/signature-v1.txt"; then
            echo "::error::V1 JAR signature absent or invalid"
            exit 1
          fi
          for scheme in v2 v3; do
            if ! grep -Eiq "^Verified using $scheme scheme .*: true$" "$RUNNER_TEMP/signature.txt"; then
              echo "::error::APK $scheme signature was not verified"
              exit 1
            fi
          done
          # All signatures must share the same definitive GitHub keystore certificate.
          V1_CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/signature-v1.txt")"
          V23_CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/signature.txt")"
          if [[ -z "$V1_CERT" || "$V1_CERT" != "$V23_CERT" ]]; then
            echo "::error::V1 and V2/V3 certificates differ"
            exit 1
          fi
          grep -Ei 'Verified using v1 scheme' "$RUNNER_TEMP/signature-v1.txt"
          grep -Ei 'Verified using v[23] scheme' "$RUNNER_TEMP/signature.txt"
          "$TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          "$TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='com.ghostdeveloper.spdecode'" "$RUNNER_TEMP/badging.txt"
          grep -F "versionName='$VERSION'" "$RUNNER_TEMP/badging.txt"
          mkdir -p dist
          cp "$APK" "dist/SP-DECODE-v$VERSION-production-signed.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          {
            printf 'Version: %s\nSource commit: %s\n' "$VERSION" "$SOURCE_SHA"
            printf '%s\n' 'V1 verified cryptographically at API23:'
            grep -E 'Verified using v1 scheme' "$RUNNER_TEMP/signature-v1.txt"
            printf '%s\n' 'V2/V3 verified on supported Android API24+:'
            grep -E 'Verified using v[23] scheme|Signer #1 certificate SHA-256 digest:' \
              "$RUNNER_TEMP/signature.txt"
          } > dist/SIGNATURE_VERIFICATION.txt
      - name: Verify permanent production certificate matches previous public v1.0.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prior-certificate"
          # Public evidence only; never download or export a signing private key.
          gh release download "v1.0.5-rc.1" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern SIGNATURE_VERIFICATION.txt \
            --dir "$RUNNER_TEMP/prior-certificate"
          OLD_REPORT="$RUNNER_TEMP/prior-certificate/SIGNATURE_VERIFICATION.txt"
          NEW_REPORT="dist/SIGNATURE_VERIFICATION.txt"
          test -s "$OLD_REPORT"
          test -s "$NEW_REPORT"
          OLD_CERT="$(grep -m1 '^Signer #1 certificate SHA-256 digest:' "$OLD_REPORT" | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')"
          NEW_CERT="$(grep -m1 '^Signer #1 certificate SHA-256 digest:' "$NEW_REPORT" | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')"
          test -n "$OLD_CERT" && test -n "$NEW_CERT"
          if [[ "$OLD_CERT" != "$NEW_CERT" ]]; then
            echo "::error::Production keystore certificate DOES NOT match v1.0.5; in-place update is unsafe"
            exit 1
          fi
          printf 'Previous public signer: v1.0.5-rc.1\nSame permanent SHA-256 signer certificate: yes\n' >> "$NEW_REPORT"
          echo "Permanent release signing identity matches the previous public APK"

      - name: Upload production-signed APK (never a debug certificate)
        uses: actions/upload-artifact@v4
        with:
          name: SP-DECODE-v${{ needs.preflight.outputs.version }}-PRODUCTION-SIGNED
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Destroy temporary copy of private keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/spdecode-production.p12"

  publication-gate:
    name: Check audited or owner-approved stable release evidence
    needs: [preflight, sign-production]
    if: needs['sign-production'].result == 'success'
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.check.outputs.approved }}
      preview_allowed: ${{ steps.check.outputs.preview_allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - id: check
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          if python scripts/android_release_gate.py --mode stable --version "$VERSION"; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
            echo "preview_allowed=false" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
            if python scripts/android_release_gate.py --mode public-preview --version "$VERSION"; then
              echo "preview_allowed=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Public signed prerelease authorized; verified stable release remains NO-GO."
            else
              echo "preview_allowed=false" >> "$GITHUB_OUTPUT"
              echo "::notice::All public GitHub Releases remain blocked pending explicit owner approval."
            fi
          fi

  publish-stable:
    name: Publish stable GitHub Release only after release gate and production signing
    needs: [preflight, sign-production, publication-gate]
    if: needs['publication-gate'].outputs.approved == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SP-DECODE-v${{ needs.preflight.outputs.version }}-PRODUCTION-SIGNED
          path: dist
      - name: Publish approved production-signed stable APK only once per version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::v$VERSION already exists; no tag/asset will be overwritten"
            exit 0
          fi
          (cd dist && sha256sum --check SHA256SUMS.txt)
          grep -Fx "Source commit: $SOURCE_SHA" dist/SIGNATURE_VERIFICATION.txt
          gh release create "v$VERSION" \
            "dist/SP-DECODE-v$VERSION-production-signed.apk" \
            "dist/SHA256SUMS.txt" "dist/SIGNATURE_VERIFICATION.txt" \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "SP-DECODE Android v$VERSION" --latest \
            --notes "SP-DECODE Android v$VERSION — stable production APK. NPVS v5: authenticated Kotlin decoder now resolves explicitly marked nested npvs1: Base64 values and JSON recursively, with full Python parity on a signed synthetic v5 fixture; preserves opaque unmarked credentials, multiline payloads and previous HTTP Injector (.ehi) complete-JSON correction. NPVS v1 and recipient-locked v6 are not covered by this method. The APK is offline, built from the exact successful main SHA and signed with the permanent GitHub Secrets certificate (V1/V2/V3); SHA-256, 16 KiB ZIP alignment and upgrade signing identity verified. Owner explicitly approved production v1.0.8 with documented risk limits. Emulator and synthetic parity PASS; independent all-vendor corpus, physical-device rerun of specific NPVS sample, accessibility and installed-upgrade logs remain pending. This is NOT certification for all 239 vendor exporter variants. Evidence: docs/android/NPVS_V5_ANDROID_1_0_8_RELEASE.md; release/android-readiness.json."

  publish-signed-preview:
    name: Publish public production-signed prerelease (stable GO remains separate)
    needs: [preflight, sign-production, publication-gate]
    if: needs['publication-gate'].outputs.preview_allowed == 'true' && needs['publication-gate'].outputs.approved != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SP-DECODE-v${{ needs.preflight.outputs.version }}-PRODUCTION-SIGNED
          path: dist
      - name: Verify release assets and publish signed public preview
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}-rc.1"
          APK="dist/SP-DECODE-v${VERSION}-production-signed.apk"
          test -s "$APK"
          test -s dist/SHA256SUMS.txt
          test -s dist/SIGNATURE_VERIFICATION.txt
          (cd dist && sha256sum --check SHA256SUMS.txt)
          grep -Fx "Source commit: $SOURCE_SHA" dist/SIGNATURE_VERIFICATION.txt
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Public prerelease $TAG already exists; no tag or asset will be overwritten"
            exit 0
          fi
          cat > "$RUNNER_TEMP/release-preview-notes.md" <<'NOTES'
          ## SP-DECODE Android — Signed Release Preview

          This is the real **release APK signed with the permanent production keystore** from GitHub Secrets, not a debug or temporary-key build.

          **QA status: public prerelease.** The stable publication gate remains **NO-GO** because documented evidence is incomplete. Physical ARM64, 16 KiB, real-file and batch results were reported by the project owner, but independent reproducible reports, accessibility/performance and signed-install/upgrade evidence have not all been recorded. Do not treat this prerelease as a fully verified stable build.

          Assets: APK, `SHA256SUMS.txt` for integrity checking, and `SIGNATURE_VERIFICATION.txt` with V1/V2/V3 checks and source commit.

          **Updating from debug:** A debug-signed APK has a different signing certificate and cannot update in place. Uninstalling it may delete locally encrypted history. Export results you want to retain first.

          Once all stable release requirements are met and the audited status is changed to GO, the workflow can publish the stable release separately.
          NOTES
          gh release create "$TAG" \
            "$APK" dist/SHA256SUMS.txt dist/SIGNATURE_VERIFICATION.txt \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "SP-DECODE Android v${VERSION} - Signed Release Preview" \
            --prerelease --notes-file "$RUNNER_TEMP/release-preview-notes.md"
