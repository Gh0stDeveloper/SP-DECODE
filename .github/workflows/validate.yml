name: Validate SP-DECODE

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install PHP runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Node.js dependencies
        run: npm ci

      - name: Check installer shell syntax
        run: bash -n installers/install-termux.sh installers/install-vps.sh scripts/spdecode-termux.sh scripts/spdecode-vps.sh

      - name: Validate project
        run: python validate_project.py

      - name: Verify 239-format Android catalog and 81 source-exact generic profiles
        run: |
          PYTHONPATH=. python scripts/android_a24_catalog.py
          PYTHONPATH=. python scripts/android_b_generic_profiles.py --check
          PYTHONPATH=. python scripts/android_c_ultra_profiles.py --check
          PYTHONPATH=. python scripts/android_d_renz_profiles.py --check

      - name: Verify Phase E source parity generator
        run: PYTHONPATH=. python -m unittest tests.test_android_e_special_parity -v

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify standard-IV EHI with original Python decoder
        run: PYTHONPATH=. python scripts/android_ehi_standard_fixture.py --output-dir "$RUNNER_TEMP/ehi-standard"

      - name: Probe batch-seven synthetic decoder candidates
        run: PYTHONPATH=. python tests/golden/a23_probe7.py

      - name: Probe final SSH synthetic decoder fixture (diagnostic)
        run: PYTHONPATH=. python tests/golden/a23_probe8_ssh.py

      - name: A.2 static decoder source audit (read-only)
        run: python docs/android/audit_decoders.py --output-dir "$RUNNER_TEMP/spdecode-a2"

      - name: Upload sanitized A.2 decoder audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spdecode-android-a2-audit
          path: ${{ runner.temp }}/spdecode-a2/
          if-no-files-found: ignore
          retention-days: 30

      - name: Generate A.2.3 synthetic golden coverage (metadata only)
        run: PYTHONPATH=. python tests/golden/a23_report.py --output "$RUNNER_TEMP/spdecode-a23/coverage.json"

      - name: Export synthetic decoder samples with frozen hashes
        run: PYTHONPATH=. python tests/golden/a23_export.py --output-dir "$RUNNER_TEMP/spdecode-a23/samples"

      - name: Upload A.2.3 synthetic golden coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spdecode-android-a23-golden-coverage
          path: ${{ runner.temp }}/spdecode-a23/
          if-no-files-found: ignore
          retention-days: 30

      - name: Validate Android documentation and editable SVGs
        run: python docs/android/validate_docs.py


  android-parity:
    name: Android v1.0.5 production source regression (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK platform (runner SDK, no deprecated tools package)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Python fixture dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate reference AES-GCM and DES-ECB corpus for all 81 Phase B suffixes
        run: |
          PYTHONPATH=. python scripts/android_b_generic_profiles.py --check
          PYTHONPATH=. python scripts/android_c_ultra_profiles.py --check
          PYTHONPATH=. python scripts/android_d_renz_profiles.py --check
          PYTHONPATH=. python scripts/android_b_generic_profiles.py --fixtures android/app/src/androidTest/assets/parity/generic-b-fixtures.json

      - name: Generate independent Ultra/Sandok Argon2id/AES-GCM parity vectors
        run: PYTHONPATH=. python scripts/android_c_ultra_profiles.py --fixtures android/app/src/androidTest/assets/parity/ultra-c-fixtures.json

      - name: Generate independent RENZ/7NET AES-CBC/XXTEA/Threefish parity vectors
        run: PYTHONPATH=. python scripts/android_d_renz_profiles.py --fixtures android/app/src/androidTest/assets/parity/renz-d-fixtures.json

      - name: Generate independent Phase E special-engine Python parity vectors
        run: PYTHONPATH=. python scripts/android_e_special_fixtures.py --fixtures android/app/src/androidTest/assets/parity/e-special-fixtures.json

      - name: Prepare SHA-256-pinned synthetic parity assets
        run: PYTHONPATH=. python scripts/android_a24_prepare.py --output-dir android/app/src/androidTest/assets/parity

      - name: Generate verified standard-IV EHI Android parity sample
        run: PYTHONPATH=. python scripts/android_ehi_standard_fixture.py --output-dir android/app/src/androidTest/assets/parity

      - name: Export HTTP Custom HCCFG and SocksIP VER8 synthetic parity samples
        run: PYTHONPATH=. python scripts/android_hc_sip_fixture_export.py --output-dir android/app/src/androidTest/assets/parity

      - name: Export LinkLayer VER6 synthetic Python parity samples
        run: PYTHONPATH=. python scripts/android_linklayer_fixture_export.py --output-dir android/app/src/androidTest/assets/parity

      - name: Export NPVS v5 signed synthetic Python parity sample
        run: PYTHONPATH=. python scripts/android_npvs_fixture_export.py --output-dir android/app/src/androidTest/assets/parity

      - name: Export additional Dark Tunnel Python MessagePack parity cases
        run: PYTHONPATH=. python scripts/android_dark_variant_fixture.py --output-dir android/app/src/androidTest/assets/parity

      - name: Compile audited NPV white-box to offline data-only Android asset
        run: PYTHONPATH=. python scripts/android_a24_whitebox_export.py --output android/app/src/main/assets/npv_whitebox.bin

      - name: Verify 239-format Android support catalog and Phase B profiles
        run: |
          PYTHONPATH=. python scripts/android_a24_catalog.py
          PYTHONPATH=. python scripts/android_b_generic_profiles.py --check
          PYTHONPATH=. python scripts/android_c_ultra_profiles.py --check
          PYTHONPATH=. python scripts/android_d_renz_profiles.py --check

      - name: Build SP-DECODE full-result language/settings alpha APK and tests
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:assembleAndroidTest

      - name: Enable hardware acceleration for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run parity tests on connected Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            cd android && gradle --no-daemon :app:connectedDebugAndroidTest
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.ghostdeveloper.spdecode
            adb shell am start -n com.ghostdeveloper.spdecode/.MainActivity
            sleep 3
            mkdir -p android/app/build/outputs/spdecode-ui
            adb exec-out screencap -p > android/app/build/outputs/spdecode-ui/home.png

      - name: Upload real Compose home screenshot from emulator
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SP-DECODE-Android-v1.0.5-ci-home-screenshot
          path: android/app/build/outputs/spdecode-ui/home.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spdecode-a24-android-parity-test-evidence
          path: |
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload functional SP-DECODE alpha debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SP-DECODE-Android-v1.0.5-CI-DEBUG-NOT-PRODUCTION
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
