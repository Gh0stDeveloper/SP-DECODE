name: Validate SP-DECODE

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install PHP runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Node.js dependencies
        run: npm ci

      - name: Check installer shell syntax
        run: bash -n installers/install-termux.sh installers/install-vps.sh scripts/spdecode-termux.sh scripts/spdecode-vps.sh

      - name: Validate project
        run: python validate_project.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate Android documentation and editable SVGs
        run: python docs/android/validate_docs.py
