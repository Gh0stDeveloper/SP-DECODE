name: SP-DECODE Cloud C7 Integration and Parity

on:
  push:
    branches: ["feat/cloud-c7-integration-parity"]
  pull_request:
    paths:
      - "cloud/**"
      - "android/app/src/main/java/com/ghostdeveloper/spdecode/cloud/**"
      - "docs/cloud/C7_*"
      - "scripts/cloud_c7_release_gate.py"
      - ".github/workflows/cloud-c7.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway-worker:
    name: C7 Android API contract → live private worker → original scripts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native PHP scripts runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli
      - name: Install original backend Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install original Node scripts and Next.js
        run: |
          npm ci --omit=dev --no-audit --no-fund
          cd cloud/web
          npm install --no-audit --no-fund
      - name: Test API, admin auth, quotas and security
        working-directory: cloud/web
        run: npm test
      - name: Test C7 real loopback worker chain and independent golden references
        env:
          PYTHON: python
          NODE_ENV: test
        run: node --test cloud/tests/c7-e2e.test.mjs
      - name: Verify C7 staging and production blockers
        run: |
          python -m unittest cloud.tests.test_c7_release_gate -v
          python scripts/cloud_c7_release_gate.py --stage
      - name: Ensure C7 cannot accidentally authorize production
        run: |
          if python scripts/cloud_c7_release_gate.py --production; then
            echo "ERROR: C7 must not auto-certify a production rollout" >&2
            exit 1
          fi
      - name: Check Docker service topology
        run: docker compose -f cloud/compose.yaml config --quiet

  android-cloud:
    name: C7 verify Android JNI artifact and Cloud-only APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: C4 and C5 source isolation
        run: |
          PYTHONPATH=. python -m unittest tests.test_cloud_c4_android_bridge tests.test_cloud_c5_source_isolation -v
      - name: Install NDK CMake and Android API 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Assemble Cloud APK with synthetic public HTTPS origin
        working-directory: android
        env:
          SPDECODE_CLOUD_API_BASE_URL: https://api.spdecode.example
        run: gradle --no-daemon :app:assembleDebug
      - name: Confirm actual APK excludes offline engines and credentials
        run: python tests/cloud_c5_apk_audit.py android/app/build/outputs/apk/debug/app-debug.apk
